version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: summary_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  rsshub:
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: always
    ports:
      - "${RSSHUB_PORT:-1200}:1200"
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
      - MEMORY_MAX_HOST_SIZE=1024
      - TG_OPTIONS_TIMEOUT=15000


volumes:
  pg_data: